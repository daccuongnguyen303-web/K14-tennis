<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quỹ Tổ Tennis K14</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_MEMBERS = [
      { id: 'm1', name: 'Cường "Federer"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'VIB', accountNo: '0987654321', accountName: 'NGUYEN DAC CUONG' },
      { id: 'm2', name: 'Hùng "Nadal"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'VCB', accountNo: '0011002233445', accountName: 'TRAN MANH HUNG' },
      { id: 'm3', name: 'Tuấn "Djokovic"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'TCB', accountNo: '1903456789012', accountName: 'LE ANH TUAN' },
      { id: 'm4', name: 'Long "Zverev"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'MB', accountNo: '888899996666', accountName: 'PHAM HOANG LONG' },
      { id: 'm5', name: 'Kiên "Smash"', joinDate: '2026-11-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 1400000, bankId: 'ACB', accountNo: '123456789', accountName: 'HOANG TRUNG KIEN' },
      { id: 'm6', name: 'Đức "Slice"', joinDate: '2026-11-15', active: true, inTennis: true, inNhau: false, inDo: true, quarterPaid: 1000000, bankId: 'VPB', accountNo: '0912345678', accountName: 'VU MINH DUC' },
      { id: 'm7', name: 'Tùng "Dũng Sĩ Diệt Mồi"', joinDate: '2026-10-01', active: true, inTennis: false, inNhau: true, inDo: false, quarterPaid: 0, bankId: 'BIDV', accountNo: '12510000998877', accountName: 'NGUYEN THANH TUNG' },
      { id: 'm8', name: 'Bình "Chủ Quán Bia"', joinDate: '2026-10-01', active: true, inTennis: false, inNhau: true, inDo: false, quarterPaid: 0, bankId: 'CTG', accountNo: '105868686868', accountName: 'DANG QUOC BINH' },
    ];

    const INITIAL_SESSIONS = [
      { id: 's1', date: '2026-10-08', water: 120000, ballBoy: 150000, balls: 180000, overtime: 200000, note: 'Mở màn Quý 4' },
      { id: 's2', date: '2026-11-05', water: 150000, ballBoy: 200000, balls: 0, overtime: 150000, note: 'Chào mừng Kiên Smash' },
    ];

    const INITIAL_NHAU = [
      { id: 'n1', date: '2026-10-15', title: 'Lẩu bò nhúng dấm sau sân', payerId: 'm1', totalBill: 2100000, participants: ['m1', 'm2', 'm3', 'm4', 'm7', 'm8'] },
    ];

    const INITIAL_BETS = [
      { id: 'b1', date: '2026-10-12', matchName: 'Đôi Nam Đỉnh Cao', winners: ['m1', 'm2'], losers: ['m3', 'm4'], score: '6-4', amountPerLoser: 30000, paidByLosers: ['m3'] },
      { id: 'b2', date: '2026-12-03', matchName: 'Siêu Kinh Điển Cuối Quý', winners: ['m1', 'm3'], losers: ['m2', 'm5'], score: '7-5', amountPerLoser: 50000, paidByLosers: [] },
    ];

    const THREAT_MESSAGES = [
      "⚠️ Cảnh cáo nghiêm khắc: Đừng để Chủ tịch phải gọi điện trực tiếp nhắc nợ! Tiền quỹ sân và tiền độ chậm ngày nào, vợ con ở nhà lo lắng ngày đó!",
      "🚨 Thông báo khẩn: Sống trên đời ăn miếng trả miếng, chơi tennis đóng quỹ sòng phẳng. Ai còn nợ phí sang tuần ra sân chuẩn bị tinh thần ôm vợt đứng ngoài nhìn anh em đánh!",
      "⚡ Nhắc nhở lần cuối: Tiền quỹ không tự sinh ra và cũng không tự mất đi, nó chỉ chạy từ túi kẻ chậm đóng sang túi người thu quỹ. Nộp tiền ngay kẻo muộn!",
      "🔥 Cây muốn lặng mà gió chẳng ngừng, anh em muốn đánh tennis mà quỹ cứ âm thì đừng trách sao bóng bay thẳng vào mặt lúc ra sân!",
      "🎯 Kỷ luật tổ K14 thép: Nợ quỹ, nợ độ, nợ nhậu là những tội danh không thể dung thứ. Chuyển khoản ngay lập tức để bảo vệ danh dự bản thân trước hội đồng!"
    ];

    const formatVND = (num) => Math.round(num || 0).toLocaleString('vi-VN') + 'đ';

    function App() {
      const [activeTab, setActiveTab] = useState('thongbao');
      const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('k14_members')) || INITIAL_MEMBERS);
      const [tennisPresidentId, setTennisPresidentId] = useState(() => localStorage.getItem('k14_tennis_pres') || 'm1');
      const [betPresidentId, setBetPresidentId] = useState(() => localStorage.getItem('k14_bet_pres') || 'm2');
      const [quarterConfig, setQuarterConfig] = useState(() => JSON.parse(localStorage.getItem('k14_quarter_cfg')) || { name: 'Quý 4/2026', startDate: '2026-10-01', endDate: '2026-12-31', baseCourtBookingFee: 9000000 });
      const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem('k14_sessions')) || INITIAL_SESSIONS);
      const [nhauList, setNhauList] = useState(() => JSON.parse(localStorage.getItem('k14_nhau')) || INITIAL_NHAU);
      const [bets, setBets] = useState(() => JSON.parse(localStorage.getItem('k14_bets')) || INITIAL_BETS);

      const [hoveredQR, setHoveredQR] = useState(null); // { bankId, accountNo, accountName, title }
      const [randomThreat, setRandomThreat] = useState('');

      useEffect(() => {
        const randomIndex = Math.floor(Math.random() * THREAT_MESSAGES.length);
        setRandomThreat(THREAT_MESSAGES[randomIndex]);
      }, []);

      useEffect(() => { localStorage.setItem('k14_members', JSON.stringify(members)); }, [members]);
      useEffect(() => { localStorage.setItem('k14_tennis_pres', tennisPresidentId); }, [tennisPresidentId]);
      useEffect(() => { localStorage.setItem('k14_bet_pres', betPresidentId); }, [betPresidentId]);
      useEffect(() => { localStorage.setItem('k14_quarter_cfg', JSON.stringify(quarterConfig)); }, [quarterConfig]);
      useEffect(() => { localStorage.setItem('k14_sessions', JSON.stringify(sessions)); }, [sessions]);
      useEffect(() => { localStorage.setItem('k14_nhau', JSON.stringify(nhauList)); }, [nhauList]);
      useEffect(() => { localStorage.setItem('k14_bets', JSON.stringify(bets)); }, [bets]);

      const tennisCalculations = useMemo(() => {
        const qStart = new Date(quarterConfig.startDate);
        const qEnd = new Date(quarterConfig.endDate);
        const tennisMembers = members.filter(m => m.active && m.inTennis);
        const activeDaysMap = {};
        let sumActiveDays = 0;

        tennisMembers.forEach(m => {
          const effectiveStart = new Date(m.joinDate) > qStart ? new Date(m.joinDate) : qStart;
          const days = Math.max(0, Math.round((qEnd - effectiveStart) / (1000 * 60 * 60 * 24)) + 1);
          activeDaysMap[m.id] = days;
          sumActiveDays += days;
        });

        const sessionShares = {};
        tennisMembers.forEach(m => { sessionShares[m.id] = 0; });
        let totalSessionsCost = 0;

        sessions.forEach(s => {
          const sCost = Number(s.water || 0) + Number(s.ballBoy || 0) + Number(s.balls || 0) + Number(s.overtime || 0);
          totalSessionsCost += sCost;
          const eligible = tennisMembers.filter(m => new Date(m.joinDate) <= new Date(s.date));
          const count = eligible.length || 1;
          eligible.forEach(m => { sessionShares[m.id] += sCost / count; });
        });

        const memberBreakdown = tennisMembers.map(m => {
          const ratio = sumActiveDays > 0 ? activeDaysMap[m.id] / sumActiveDays : 0;
          const proratedBaseFee = quarterConfig.baseCourtBookingFee * ratio;
          const totalUsed = proratedBaseFee + (sessionShares[m.id] || 0);
          const balance = Number(m.quarterPaid || 0) - totalUsed;
          return { ...m, totalUsed, balance };
        });

        const totalPaidInitial = tennisMembers.reduce((acc, m) => acc + Number(m.quarterPaid || 0), 0);
        return { memberBreakdown, totalPaidInitial, totalSessionsCost, netFundBalance: totalPaidInitial - (quarterConfig.baseCourtBookingFee + totalSessionsCost) };
      }, [members, quarterConfig, sessions]);

      const nhauCalculations = useMemo(() => {
        const stats = {};
        members.forEach(m => { stats[m.id] = { paidOut: 0, consumed: 0, net: 0, lastPayer: null }; });
        nhauList.forEach(item => {
          const bill = Number(item.totalBill || 0);
          if (stats[item.payerId]) {
            stats[item.payerId].paidOut += bill;
            stats[item.payerId].lastPayer = item.payerId;
          }
          const share = bill / (item.participants.length || 1);
          item.participants.forEach(pid => { if (stats[pid]) stats[pid].consumed += share; });
        });
        Object.keys(stats).forEach(id => { stats[id].net = stats[id].paidOut - stats[id].consumed; });
        return { stats };
      }, [members, nhauList]);

      const betCalculations = useMemo(() => {
        const stats = {};
        members.forEach(m => { stats[m.id] = { unpaidAmount: 0 }; });
        bets.forEach(b => {
          const amt = Number(b.amountPerLoser || 0);
          b.losers.forEach(lid => {
            if (stats[lid] && !(b.paidByLosers || []).includes(lid)) {
              stats[lid].unpaidAmount += amt;
            }
          });
        });
        return { stats };
      }, [members, bets]);

      const tennisPresident = members.find(m => m.id === tennisPresidentId) || members[0];
      const betPresident = members.find(m => m.id === betPresidentId) || members[1];
      const lastNhauPayer = members.find(m => m.id === nhauList[nhauList.length - 1]?.payerId) || members[0];

      const noticeTableData = useMemo(() => {
        return members.filter(m => m.active).map(m => {
          const tInfo = tennisCalculations.memberBreakdown.find(x => x.id === m.id);
          const tennisDebt = tInfo && tInfo.balance < 0 ? Math.abs(tInfo.balance) : 0;
          
          const nInfo = nhauCalculations.stats[m.id] || { net: 0 };
          const nhauDebt = nInfo.net < 0 ? Math.abs(nInfo.net) : 0;
          
          const betDebt = (betCalculations.stats[m.id] || {}).unpaidAmount || 0;

          return {
            ...m,
            tennisDebt,
            nhauDebt,
            betDebt,
            toTennisPresident: tennisDebt,
            toBetPresident: betDebt,
            toNhauPayer: nhauDebt
          };
        });
      }, [members, tennisCalculations, nhauCalculations, betCalculations]);

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 pb-16 relative">
          <header className="border-b border-emerald-900/20 bg-emerald-950 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-white text-emerald-950 flex items-center justify-center font-black text-xl shadow-lg border-2 border-emerald-800">K14</div>
                <div>
                  <h1 className="text-lg md:text-xl font-black tracking-tight text-white uppercase">Quỹ Tổ Tennis K14</h1>
                  <p className="text-xs text-emerald-300">Chủ tịch Sân: <strong className="text-white">{tennisPresident?.name}</strong> • Chủ tịch Độ: <strong className="text-white">{betPresident?.name}</strong></p>
                </div>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto gap-1.5 pb-2.5">
              {[
                { id: 'thongbao', label: '📢 1. Thông Báo & Đòi Nợ' },
                { id: 'tennis', label: '🎾 2. Quỹ Sân Tennis' },
                { id: 'nhau', label: '🍻 3. Quỹ Nhậu' },
                { id: 'do', label: '🏆 4. Kết Quả Độ' },
                { id: 'congno', label: '📊 5. Báo Cáo Công Nợ' },
                { id: 'qr', label: '💳 6. VietQR' },
                { id: 'members', label: '👥 Thành Viên (' + members.length + ')' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap transition-all ${activeTab === t.id ? 'bg-white text-emerald-950 shadow-md' : 'bg-emerald-900/60 text-emerald-100 hover:bg-emerald-900'}`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-6 space-y-6">
            {activeTab === 'thongbao' && (
              <div className="space-y-6">
                {/* Khu vực câu răn đe đòi nợ gắt gao */}
                <div className="bg-rose-950 border-2 border-rose-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                  <div className="absolute -right-4 -bottom-4 text-rose-900/40 text-8xl font-black select-none pointer-events-none">⚠️</div>
                  <h2 className="text-lg font-black uppercase tracking-wide text-rose-400 mb-2 flex items-center gap-2">
                    <span>🚨 GÓC CẢNH BÁO NỢ PHÍ TỔ TENNIS K14</span>
                  </h2>
                  <p className="text-sm md:text-base font-semibold text-rose-100 italic leading-relaxed">
                    "{randomThreat}"
                  </p>
                  <div className="mt-3 text-xs text-rose-300 font-mono">
                    💡 Mẹo: Di chuột vào các con số tiền nợ trong bảng bên dưới để hiện ngay mã QR chuyển khoản cho đúng người thu!
                  </div>
                </div>

                {/* Bảng nhắc đóng tiền 6 cột */}
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                  <h3 className="text-base font-bold mb-3 text-emerald-950">Bảng Tổng Hợp Nhắc Đóng Phí & Thông Tin Chuyển Khoản</h3>
                  <table className="w-full text-left text-sm">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="py-3 px-3">Thành viên</th>
                        <th className="py-3 px-3">Tiền sân bóng</th>
                        <th className="py-3 px-3">Tiền độ</th>
                        <th className="py-3 px-3">Tiền nhậu</th>
                        <th className="py-3 px-3 text-emerald-800">Đóng Chủ tịch Sân</th>
                        <th className="py-3 px-3 text-amber-800">Đóng Chủ tịch Độ</th>
                        <th className="py-3 px-3 text-indigo-800">Gửi Người Trả Nhậu</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {noticeTableData.map(m => (
                        <tr key={m.id} className="hover:bg-slate-50">
                          <td className="py-3 px-3 font-bold text-slate-900">{m.name}</td>
                          <td className="py-3 px-3">{formatVND(m.tennisDebt)}</td>
                          <td className="py-3 px-3">{formatVND(m.betDebt)}</td>
                          <td className="py-3 px-3">{formatVND(m.nhauDebt)}</td>
                          
                          {/* Cột đóng Chủ tịch Sân */}
                          <td 
                            className="py-3 px-3 font-bold text-emerald-700 cursor-pointer hover:underline"
                            onMouseEnter={() => setHoveredQR({ bankId: tennisPresident.bankId, accountNo: tennisPresident.accountNo, accountName: tennisPresident.accountName, title: `Đóng Quỹ Sân cho Chủ tịch: ${tennisPresident.name}` })}
                            onMouseLeave={() => setHoveredQR(null)}
                          >
                            {formatVND(m.toTennisPresident)} 📌
                          </td>

                          {/* Cột đóng Chủ tịch Độ */}
                          <td 
                            className="py-3 px-3 font-bold text-amber-700 cursor-pointer hover:underline"
                            onMouseEnter={() => setHoveredQR({ bankId: betPresident.bankId, accountNo: betPresident.accountNo, accountName: betPresident.accountName, title: `Đóng Tiền Độ cho Chủ tịch Độ: ${betPresident.name}` })}
                            onMouseLeave={() => setHoveredQR(null)}
                          >
                            {formatVND(m.toBetPresident)} 📌
                          </td>

                          {/* Cột gửi Người trả nhậu */}
                          <td 
                            className="py-3 px-3 font-bold text-indigo-700 cursor-pointer hover:underline"
                            onMouseEnter={() => setHoveredQR({ bankId: lastNhauPayer.bankId, accountNo: lastNhauPayer.accountNo, accountName: lastNhauPayer.accountName, title: `Thanh toán Tiền Nhậu cho: ${lastNhauPayer.name}` })}
                            onMouseLeave={() => setHoveredQR(null)}
                          >
                            {formatVND(m.toNhauPayer)} 📌
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <p className="text-xs text-slate-400 mt-3 italic">* Lưu ý: Đưa con trỏ chuột vào các con số ở 3 cột cuối để hiện mã QR chuyển khoản tương ứng ngay lập tức.</p>
                </div>
              </div>
            )}

            {activeTab === 'tennis' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Tổng Thu Đầu Quý</span>
                    <div className="text-2xl font-black text-emerald-800 mt-1">{formatVND(tennisCalculations.totalPaidInitial)}</div>
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Tiền Đặt Sân Cố Định</span>
                    <input type="number" value={quarterConfig.baseCourtBookingFee} onChange={e => setQuarterConfig({...quarterConfig, baseCourtBookingFee: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-lg font-bold text-slate-800 mt-1" />
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Nước + Nhặt Bóng + Thêm Giờ</span>
                    <div className="text-2xl font-black text-emerald-700 mt-1">{formatVND(tennisCalculations.totalSessionsCost)}</div>
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Số Dư Quỹ Sân</span>
                    <div className={`text-2xl font-black mt-1 ${tennisCalculations.netFundBalance >= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>{formatVND(tennisCalculations.netFundBalance)}</div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                  <h3 className="text-base font-bold mb-3 text-emerald-950">Bảng Đối Trừ Quỹ Sân Tennis</h3>
                  <table className="w-full text-left text-sm">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3">Thành viên</th>
                        <th className="py-2.5 px-3">Ngày vào</th>
                        <th className="py-2.5 px-3">Đã đóng</th>
                        <th className="py-2.5 px-3">Tổng sử dụng</th>
                        <th className="py-2.5 px-3">Dư / Thiếu</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {tennisCalculations.memberBreakdown.map(m => (
                        <tr key={m.id} className="hover:bg-slate-50">
                          <td className="py-3 px-3 font-bold text-slate-900">{m.name}</td>
                          <td className="py-3 px-3 text-xs text-slate-500">{m.joinDate}</td>
                          <td className="py-3 px-3"><input type="number" value={m.quarterPaid} onChange={e => setMembers(members.map(mem => mem.id === m.id ? {...mem, quarterPaid: Number(e.target.value)} : mem))} className="w-28 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-bold text-emerald-900" /></td>
                          <td className="py-3 px-3 font-medium">{formatVND(m.totalUsed)}</td>
                          <td className={`py-3 px-3 font-black ${m.balance >= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>{formatVND(m.balance)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'nhau' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                <h3 className="text-base font-bold mb-3 text-emerald-950">Danh Sách Quỹ Nhậu</h3>
                <table className="w-full text-left text-sm">
                  <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">Ngày</th>
                      <th className="py-2.5 px-3">Nội dung</th>
                      <th className="py-2.5 px-3">Tổng Bill</th>
                      <th className="py-2.5 px-3">Số người</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {nhauList.map(n => (
                      <tr key={n.id} className="hover:bg-slate-50">
                        <td className="py-3 px-3 text-slate-600">{n.date}</td>
                        <td className="py-3 px-3 font-bold text-slate-900">{n.title}</td>
                        <td className="py-3 px-3 font-bold text-emerald-800">{formatVND(n.totalBill)}</td>
                        <td className="py-3 px-3 text-slate-600">{n.participants.length} người</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'do' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                <h3 className="text-base font-bold mb-3 text-emerald-950">Sheet Kết Quả Độ Tennis</h3>
                <table className="w-full text-left text-sm">
                  <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">Ngày</th>
                      <th className="py-2.5 px-3">Trận đấu</th>
                      <th className="py-2.5 px-3">Tỷ số</th>
                      <th className="py-2.5 px-3">Tiền thua/người</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {bets.map(b => (
                      <tr key={b.id} className="hover:bg-slate-50">
                        <td className="py-3 px-3 text-slate-600">{b.date}</td>
                        <td className="py-3 px-3 font-bold text-slate-900">{b.matchName}</td>
                        <td className="py-3 px-3 text-emerald-700 font-bold">{b.score}</td>
                        <td className="py-3 px-3 text-emerald-900 font-bold">{formatVND(b.amountPerLoser)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'congno' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                <h2 className="text-lg font-black mb-4 text-emerald-950">Báo Cáo Công Nợ Chi Tiết</h2>
                <table className="w-full text-left text-sm">
                  <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">Thành viên</th>
                      <th className="py-2.5 px-3">Quỹ Sân</th>
                      <th className="py-2.5 px-3">Quỹ Nhậu</th>
                      <th className="py-2.5 px-3">Quỹ Độ</th>
                      <th className="py-2.5 px-3">Tổng Cần Đóng</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {noticeTableData.map(p => (
                      <tr key={p.id} className="hover:bg-slate-50">
                        <td className="py-3 px-3 font-bold text-slate-900">{p.name}</td>
                        <td className="py-3 px-3">{p.tennisDebt > 0 ? formatVND(p.tennisDebt) : '0đ'}</td>
                        <td className="py-3 px-3">{p.nhauDebt > 0 ? formatVND(p.nhauDebt) : '0đ'}</td>
                        <td className="py-3 px-3">{p.betDebt > 0 ? formatVND(p.betDebt) : '0đ'}</td>
                        <td className="py-3 px-3 font-black text-rose-600">{formatVND(p.totalMustPay)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'qr' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {members.map(m => {
                  const qrUrl = `https://img.vietqr.io/image/${m.bankId}-${m.accountNo}-compact2.png?amount=0&addInfo=K14&accountName=${encodeURIComponent(m.accountName)}`;
                  return (
                    <div key={m.id} className="bg-white border border-emerald-900/10 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                      <div>
                        <span className="font-bold text-sm text-slate-900">{m.name}</span>
                        <p className="text-xs text-slate-500 mt-1">{m.bankId} • <strong className="text-slate-800">{m.accountNo}</strong></p>
                      </div>
                      <div className="bg-slate-50 border border-slate-200 p-2 rounded-xl my-3">
                        <img src={qrUrl} alt={m.name} className="w-full h-auto rounded-lg" />
                      </div>
                      <button onClick={() => { navigator.clipboard.writeText(m.accountNo); alert('Đã copy STK: ' + m.accountNo); }} className="w-full py-2 rounded-lg bg-emerald-900 hover:bg-emerald-950 text-white text-xs font-semibold shadow-sm">Copy STK</button>
                    </div>
                  );
                })}
              </div>
            )}

            {activeTab === 'members' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                <h3 className="text-base font-bold mb-3 text-emerald-950">Danh Sách Thành Viên K14 ({members.length})</h3>
                <table className="w-full text-left text-sm">
                  <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">Tên</th>
                      <th className="py-2.5 px-3">Ngày vào</th>
                      <th className="py-2.5 px-3">Ngân hàng & STK</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {members.map(m => (
                      <tr key={m.id} className="hover:bg-slate-50">
                        <td className="py-3 px-3 font-bold text-slate-900">{m.name}</td>
                        <td className="py-3 px-3 text-xs text-slate-500">{m.joinDate}</td>
                        <td className="py-3 px-3 text-xs text-slate-600">{m.bankId} - {m.accountNo}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {/* Popup VietQR nổi lên khi di chuột vào ô nợ ở Tab Thông Báo */}
          {hoveredQR && (
            <div className="fixed bottom-6 right-6 z-50 bg-white border-2 border-emerald-800 p-4 rounded-2xl shadow-2xl max-w-xs animate-bounce-short">
              <div className="text-xs font-bold text-emerald-900 mb-1">{hoveredQR.title}</div>
              <div className="text-[11px] text-slate-600 mb-2">{hoveredQR.bankId} - {hoveredQR.accountNo}</div>
              <div className="bg-slate-50 p-2 rounded-xl border border-slate-200">
                <img 
                  src={`https://img.vietqr.io/image/${hoveredQR.bankId}-${hoveredQR.accountNo}-compact2.png?amount=0&addInfo=K14&accountName=${encodeURIComponent(hoveredQR.accountName)}`} 
                  alt="QR" 
                  className="w-48 h-auto mx-auto rounded" 
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
