<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quỹ Tổ Tennis K14 - Quản Lý Sân, Nhậu & Độ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel cho JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_MEMBERS = [
      { id: 'm1', name: 'Cường "Federer"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'VIB', accountNo: '0987654321', accountName: 'NGUYEN DAC CUONG' },
      { id: 'm2', name: 'Hùng "Nadal"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'VCB', accountNo: '0011002233445', accountName: 'TRAN MANH HUNG' },
      { id: 'm3', name: 'Tuấn "Djokovic"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'TCB', accountNo: '1903456789012', accountName: 'LE ANH TUAN' },
      { id: 'm4', name: 'Long "Zverev"', joinDate: '2026-10-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'MB', accountNo: '888899996666', accountName: 'PHAM HOANG LONG' },
      { id: 'm5', name: 'Kiên "Smash"', joinDate: '2026-11-01', active: true, inTennis: true, inNhau: true, inDo: true, quarterPaid: 1400000, bankId: 'ACB', accountNo: '123456789', accountName: 'HOANG TRUNG KIEN' },
      { id: 'm6', name: 'Đức "Slice"', joinDate: '2026-11-15', active: true, inTennis: true, inNhau: false, inDo: true, quarterPaid: 1000000, bankId: 'VPB', accountNo: '0912345678', accountName: 'VU MINH DUC' },
      { id: 'm7', name: 'Tùng "Dũng Sĩ Diệt Mồi"', joinDate: '2026-10-01', active: true, inTennis: false, inNhau: true, inDo: false, quarterPaid: 0, bankId: 'BIDV', accountNo: '12510000998877', accountName: 'NGUYEN THANH TUNG' },
      { id: 'm8', name: 'Bình "Chủ Quán Bia"', joinDate: '2026-10-01', active: true, inTennis: false, inNhau: true, inDo: false, quarterPaid: 0, bankId: 'CTG', accountNo: '105868686868', accountName: 'DANG QUOC BINH' },
    ];

    const INITIAL_SESSIONS = [
      { id: 's1', date: '2026-10-08', water: 120000, ballBoy: 150000, balls: 180000, overtime: 200000, note: 'Mở màn Quý 4, đánh thêm 1 tiếng', attendees: ['m1', 'm2', 'm3', 'm4'] },
      { id: 's2', date: '2026-11-05', water: 150000, ballBoy: 200000, balls: 0, overtime: 150000, note: 'Chào mừng Kiên Smash gia nhập', attendees: ['m1', 'm2', 'm3', 'm4', 'm5'] },
      { id: 's3', date: '2026-12-03', water: 160000, ballBoy: 200000, balls: 180000, overtime: 300000, note: 'Độ căng cuối quý, kẹt sân đến 22h30', attendees: ['m1', 'm2', 'm3', 'm4', 'm5', 'm6'] },
    ];

    const INITIAL_NHAU = [
      { id: 'n1', date: '2026-10-15', title: 'Lẩu bò nhúng dấm & Bia tươi sau sân', payerId: 'm1', totalBill: 2100000, participants: ['m1', 'm2', 'm3', 'm4', 'm7', 'm8'] },
      { id: 'n2', date: '2026-11-20', title: 'Izakaya Linh Lang - Mừng Kiên vào tổ', payerId: 'm7', totalBill: 3500000, participants: ['m1', 'm2', 'm3', 'm4', 'm5', 'm7', 'm8'] },
    ];

    const INITIAL_BETS = [
      { id: 'b1', date: '2026-10-12', matchName: 'Đôi Nam Đỉnh Cao', winners: ['m1', 'm2'], losers: ['m3', 'm4'], score: '6-4', amountPerLoser: 30000, paidByLosers: ['m3'] },
      { id: 'b2', date: '2026-12-03', matchName: 'Siêu Kinh Điển Tháng Cuối Quý', winners: ['m1', 'm3'], losers: ['m2', 'm5'], score: '7-5', amountPerLoser: 50000, paidByLosers: [] },
      { id: 'b3', date: '2026-12-06', matchName: 'Đơn Nam Phục Thù (Tháng 12)', winners: ['m4'], losers: ['m6'], score: '6-2', amountPerLoser: 50000, paidByLosers: ['m6'] },
    ];

    const formatVND = (num) => {
      const rounded = Math.round(num || 0);
      return rounded.toLocaleString('vi-VN') + 'đ';
    };

    const isEndOfQuarterMonth = (dateStr) => {
      if (!dateStr) return false;
      const month = new Date(dateStr).getMonth() + 1;
      return [3, 6, 9, 12].includes(month);
    };

    function App() {
      const [activeTab, setActiveTab] = useState('tennis');
      
      const [members, setMembers] = useState(() => {
        const saved = localStorage.getItem('k14_members');
        return saved ? JSON.parse(saved) : INITIAL_MEMBERS;
      });
      const [tennisPresidentId, setTennisPresidentId] = useState(() => localStorage.getItem('k14_tennis_pres') || 'm1');
      const [betPresidentId, setBetPresidentId] = useState(() => localStorage.getItem('k14_bet_pres') || 'm2');
      const [quarterConfig, setQuarterConfig] = useState(() => {
        const saved = localStorage.getItem('k14_quarter_cfg');
        return saved ? JSON.parse(saved) : {
          name: 'Quý 4/2026',
          startDate: '2026-10-01',
          endDate: '2026-12-31',
          baseCourtBookingFee: 9000000
        };
      });
      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('k14_sessions');
        return saved ? JSON.parse(saved) : INITIAL_SESSIONS;
      });
      const [nhauList, setNhauList] = useState(() => {
        const saved = localStorage.getItem('k14_nhau');
        return saved ? JSON.parse(saved) : INITIAL_NHAU;
      });
      const [bets, setBets] = useState(() => {
        const saved = localStorage.getItem('k14_bets');
        return saved ? JSON.parse(saved) : INITIAL_BETS;
      });
      const [settledStatus, setSettledStatus] = useState(() => {
        const saved = localStorage.getItem('k14_settled');
        return saved ? JSON.parse(saved) : {};
      });

      useEffect(() => { localStorage.setItem('k14_members', JSON.stringify(members)); }, [members]);
      useEffect(() => { localStorage.setItem('k14_tennis_pres', tennisPresidentId); }, [tennisPresidentId]);
      useEffect(() => { localStorage.setItem('k14_bet_pres', betPresidentId); }, [betPresidentId]);
      useEffect(() => { localStorage.setItem('k14_quarter_cfg', JSON.stringify(quarterConfig)); }, [quarterConfig]);
      useEffect(() => { localStorage.setItem('k14_sessions', JSON.stringify(sessions)); }, [sessions]);
      useEffect(() => { localStorage.setItem('k14_nhau', JSON.stringify(nhauList)); }, [nhauList]);
      useEffect(() => { localStorage.setItem('k14_bets', JSON.stringify(bets)); }, [bets]);
      useEffect(() => { localStorage.setItem('k14_settled', JSON.stringify(settledStatus)); }, [settledStatus]);

      // States cho các form nhập liệu
      const [newSession, setNewSession] = useState({ date: '2026-12-10', water: 150000, ballBoy: 200000, balls: 0, overtime: 150000, note: '' });
      const [newNhau, setNewNhau] = useState({ date: '2026-12-12', title: '', payerId: 'm1', totalBill: 2400000, participants: ['m1', 'm2', 'm3', 'm4', 'm7', 'm8'] });
      const [newBet, setNewBet] = useState({ date: '2026-12-15', matchName: 'Kèo Đôi Nam Cuối Quý', winners: ['m1'], losers: ['m3'], score: '6-4', amountPerLoser: 50000 });
      const [newMember, setNewMember] = useState({ name: '', joinDate: '2026-10-01', inTennis: true, inNhau: true, inDo: true, quarterPaid: 2000000, bankId: 'VCB', accountNo: '', accountName: '' });
      const [selectedDebtorForQR, setSelectedDebtorForQR] = useState('m3');

      const handleBetDateChange = (dateVal) => {
        const isEOQ = isEndOfQuarterMonth(dateVal);
        setNewBet(prev => ({
          ...prev,
          date: dateVal,
          amountPerLoser: isEOQ ? 50000 : prev.amountPerLoser
        }));
      };

      // TÍNH TOÁN QUỸ TENNIS (Prorate theo ngày vào)
      const tennisCalculations = useMemo(() => {
        const qStart = new Date(quarterConfig.startDate);
        const qEnd = new Date(quarterConfig.endDate);
        const totalQuarterDays = Math.max(1, Math.round((qEnd - qStart) / (1000 * 60 * 60 * 24)) + 1);

        const tennisMembers = members.filter(m => m.active && m.inTennis);
        const activeDaysMap = {};
        let sumActiveDays = 0;

        tennisMembers.forEach(m => {
          const jDate = new Date(m.joinDate);
          const effectiveStart = jDate > qStart ? jDate : qStart;
          const days = Math.max(0, Math.round((qEnd - effectiveStart) / (1000 * 60 * 60 * 24)) + 1);
          activeDaysMap[m.id] = days;
          sumActiveDays += days;
        });

        const sessionShares = {};
        tennisMembers.forEach(m => { sessionShares[m.id] = 0; });

        let totalSessionsCost = 0;
        sessions.forEach(s => {
          const sCost = Number(s.water || 0) + Number(s.ballBoy || 0) + Number(s.balls || 0) + Number(s.overtime || 0);
          totalSessionsCost += sCost;
          const eligibleMembers = tennisMembers.filter(m => new Date(m.joinDate) <= new Date(s.date));
          const count = eligibleMembers.length || 1;
          eligibleMembers.forEach(m => {
            sessionShares[m.id] = (sessionShares[m.id] || 0) + (sCost / count);
          });
        });

        const memberBreakdown = tennisMembers.map(m => {
          const ratio = sumActiveDays > 0 ? activeDaysMap[m.id] / sumActiveDays : 0;
          const proratedBaseFee = quarterConfig.baseCourtBookingFee * ratio;
          const variableFee = sessionShares[m.id] || 0;
          const totalUsed = proratedBaseFee + variableFee;
          const balance = Number(m.quarterPaid || 0) - totalUsed;
          return {
            ...m,
            activeDays: activeDaysMap[m.id],
            timeRatioPct: Math.round((activeDaysMap[m.id] / totalQuarterDays) * 100),
            proratedBaseFee,
            variableFee,
            totalUsed,
            balance
          };
        });

        const totalPaidInitial = tennisMembers.reduce((acc, m) => acc + Number(m.quarterPaid || 0), 0);
        const totalAllCosts = Number(quarterConfig.baseCourtBookingFee || 0) + totalSessionsCost;

        return { memberBreakdown, totalPaidInitial, totalSessionsCost, totalAllCosts, netFundBalance: totalPaidInitial - totalAllCosts };
      }, [members, quarterConfig, sessions]);

      // TÍNH TOÁN QUỸ NHẬU
      const nhauCalculations = useMemo(() => {
        const nhauMembers = members.filter(m => m.active && m.inNhau);
        const stats = {};
        members.forEach(m => { stats[m.id] = { paidOut: 0, consumed: 0, net: 0 }; });

        let totalNhauSpent = 0;
        nhauList.forEach(item => {
          const bill = Number(item.totalBill || 0);
          totalNhauSpent += bill;
          if (stats[item.payerId]) stats[item.payerId].paidOut += bill;
          const count = item.participants.length || 1;
          const share = bill / count;
          item.participants.forEach(pid => {
            if (stats[pid]) stats[pid].consumed += share;
          });
        });

        Object.keys(stats).forEach(id => {
          stats[id].net = stats[id].paidOut - stats[id].consumed;
        });

        return { nhauMembers, stats, totalNhauSpent };
      }, [members, nhauList]);

      // TÍNH TOÁN QUỸ ĐỘ
      const betCalculations = useMemo(() => {
        const stats = {};
        members.forEach(m => { stats[m.id] = { wins: 0, losses: 0, totalLostAmount: 0, unpaidAmount: 0, paidAmount: 0 }; });

        let totalBetPool = 0;
        let totalUnpaidPool = 0;

        bets.forEach(b => {
          const amt = Number(b.amountPerLoser || 0);
          b.winners.forEach(wid => { if (stats[wid]) stats[wid].wins += 1; });
          b.losers.forEach(lid => {
            if (stats[lid]) {
              stats[lid].losses += 1;
              stats[lid].totalLostAmount += amt;
              totalBetPool += amt;
              if ((b.paidByLosers || []).includes(lid)) {
                stats[lid].paidAmount += amt;
              } else {
                stats[lid].unpaidAmount += amt;
                totalUnpaidPool += amt;
              }
            }
          });
        });

        return { stats, totalBetPool, totalUnpaidPool };
      }, [members, bets]);

      // TỔNG HỢP CÔNG NỢ
      const personalDebts = useMemo(() => {
        return members.filter(m => m.active).map(m => {
          const tInfo = tennisCalculations.memberBreakdown.find(x => x.id === m.id);
          const tennisDebt = tInfo ? (tInfo.balance < 0 ? Math.abs(tInfo.balance) : 0) : 0;
          const tennisCredit = tInfo ? (tInfo.balance > 0 ? tInfo.balance : 0) : 0;

          const nInfo = nhauCalculations.stats[m.id] || { net: 0 };
          const nhauDebt = nInfo.net < 0 ? Math.abs(nInfo.net) : 0;
          const nhauCredit = nInfo.net > 0 ? nInfo.net : 0;

          const bInfo = betCalculations.stats[m.id] || { unpaidAmount: 0 };
          const betDebt = bInfo.unpaidAmount;

          const totalMustPay = tennisDebt + nhauDebt + betDebt;
          return { ...m, tennisDebt, tennisCredit, nhauDebt, nhauCredit, betDebt, totalMustPay };
        });
      }, [members, tennisCalculations, nhauCalculations, betCalculations]);

      const exportBackupJSON = () => {
        const data = { members, tennisPresidentId, betPresidentId, quarterConfig, sessions, nhauList, bets, settledStatus };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Quy_Tennis_K14_Backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const importBackupJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.members) setMembers(parsed.members);
            if (parsed.tennisPresidentId) setTennisPresidentId(parsed.tennisPresidentId);
            if (parsed.betPresidentId) setBetPresidentId(parsed.betPresidentId);
            if (parsed.quarterConfig) setQuarterConfig(parsed.quarterConfig);
            if (parsed.sessions) setSessions(parsed.sessions);
            if (parsed.nhauList) setNhauList(parsed.nhauList);
            if (parsed.bets) setBets(parsed.bets);
            if (parsed.settledStatus) setSettledStatus(parsed.settledStatus);
            alert('Khôi phục dữ liệu Quỹ K14 thành công!');
          } catch (err) {
            alert('File JSON không hợp lệ!');
          }
        };
        reader.readAsText(file);
      };

      const tennisPresident = members.find(m => m.id === tennisPresidentId) || members[0];
      const betPresident = members.find(m => m.id === betPresidentId) || members[1];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-16">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-lime-400 to-emerald-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
                  K14
                </div>
                <div>
                  <h1 className="text-lg md:text-xl font-black tracking-tight text-white">QUỸ TỔ TENNIS K14</h1>
                  <p className="text-xs text-slate-400">
                    Chủ tịch Sân: <strong className="text-lime-400">{tennisPresident?.name}</strong> • Chủ tịch Độ: <strong className="text-amber-400">{betPresident?.name}</strong>
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={exportBackupJSON} className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700">
                  ⬇ Sao lưu File
                </button>
                <label className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 cursor-pointer">
                  ⬆ Nạp File
                  <input type="file" accept=".json" onChange={importBackupJSON} className="hidden" />
                </label>
              </div>
            </div>

            {/* Menu Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto gap-1.5 pb-2">
              {[
                { id: 'tennis', label: '🎾 1. Quỹ Sân Tennis' },
                { id: 'nhau', label: '🍻 2. Quỹ Nhậu' },
                { id: 'do', label: '🏆 3. Kết Quả Độ (50k Cuối Quý)' },
                { id: 'congno', label: '📊 4. Báo Cáo Công Nợ' },
                { id: 'qr', label: '💳 5. VietQR Chuyển Khoản' },
                { id: 'members', label: '👥 Thành Viên (' + members.length + ')' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap transition-all ${
                    activeTab === t.id
                      ? 'bg-lime-400 text-slate-950 shadow'
                      : 'bg-slate-800/70 text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-6 space-y-6">
            {/* TAB 1: QUỸ TENNIS */}
            {activeTab === 'tennis' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Tổng Thu Đầu Quý</span>
                    <div className="text-2xl font-black text-lime-400 mt-1">{formatVND(tennisCalculations.totalPaidInitial)}</div>
                    <p className="text-xs text-slate-500 mt-1">Chủ tịch Sân: {tennisPresident?.name}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Tiền Đặt Sân Cố Định ({quarterConfig.name})</span>
                    <input
                      type="number"
                      value={quarterConfig.baseCourtBookingFee}
                      onChange={e => setQuarterConfig({...quarterConfig, baseCourtBookingFee: Number(e.target.value)})}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-lg font-bold text-white mt-1"
                    />
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Tổng Nước + Nhặt Bóng + Thêm Giờ</span>
                    <div className="text-2xl font-black text-amber-400 mt-1">{formatVND(tennisCalculations.totalSessionsCost)}</div>
                    <p className="text-xs text-slate-500 mt-1">{sessions.length} buổi đã ghi nhận</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <span className="text-xs text-slate-400">Số Dư Quỹ Sân Hiện Tại</span>
                    <div className={`text-2xl font-black mt-1 ${tennisCalculations.netFundBalance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {formatVND(tennisCalculations.netFundBalance)}
                    </div>
                    <p className="text-xs text-slate-500 mt-1">Đối trừ sang quý tiếp theo</p>
                  </div>
                </div>

                {/* Bảng thêm buổi đánh */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                  <h2 className="text-base font-bold text-lime-400 mb-3">+ Ghi Nhật Ký Buổi Đánh Tennis Mới</h2>
                  <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
                    <div>
                      <label className="text-xs text-slate-400">Ngày đánh</label>
                      <input type="date" value={newSession.date} onChange={e => setNewSession({...newSession, date: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Tiền nước</label>
                      <input type="number" value={newSession.water} onChange={e => setNewSession({...newSession, water: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Nhặt bóng</label>
                      <input type="number" value={newSession.ballBoy} onChange={e => setNewSession({...newSession, ballBoy: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Tiền bóng</label>
                      <input type="number" value={newSession.balls} onChange={e => setNewSession({...newSession, balls: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Sân thêm giờ</label>
                      <input type="number" value={newSession.overtime} onChange={e => setNewSession({...newSession, overtime: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm" />
                    </div>
                    <div className="flex items-end">
                      <button
                        onClick={() => {
                          setSessions([...sessions, { ...newSession, id: 's_' + Date.now(), attendees: members.filter(m => m.inTennis).map(m => m.id) }]);
                        }}
                        className="w-full bg-lime-400 hover:bg-lime-300 text-slate-950 font-bold py-1.5 px-3 rounded-lg text-sm"
                      >
                        Lưu Buổi Đánh
                      </button>
                    </div>
                  </div>
                </div>

                {/* Danh sách các buổi */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 overflow-x-auto">

                          <div className="flex items-center justify-between gap-1 mb-2">
                            <span className="font-bold text-sm">{m.name}</span>
                            {isTennisPres && <span className="text-[10px] bg-lime-400 text-slate-950 font-black px-2 py-0.5 rounded-full">CHỦ TỊCH SÂN</span>}
                            {isBetPres && <span className="text-[10px] bg-amber-400 text-slate-950 font-black px-2 py-0.5 rounded-full">CHỦ TỊCH ĐỘ</span>}
                          </div>
                          <p className="text-xs text-slate-400">{m.bankId} • <strong className="text-white">{m.accountNo}</strong></p>
                          <p className="text-[11px] text-slate-500 uppercase mb-3">{m.accountName}</p>
                        </div>
                        <div className="bg-white p-2 rounded-xl mb-3">
                          <img src={qrUrl} alt={m.name} className="w-full h-auto rounded-lg" />
                        </div>
                        {suggestedAmount > 0 && (
                          <div className="text-center text-xs font-bold text-lime-400 mb-2">
                            Số tiền tự điền: {formatVND(suggestedAmount)}
                          </div>
                        )}
                        <button
                          onClick={() => { navigator.clipboard.writeText(m.accountNo); alert('Đã copy STK: ' + m.accountNo); }}
                          className="w-full py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold"
                        >
                          Copy Số Tài Khoản
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 6: QUẢN LÝ THÀNH VIÊN */}
            {activeTab === 'members' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                  <h2 className="text-base font-bold text-lime-400 mb-3">+ Thêm Thành Viên Mới (Tùy Chỉnh Ngày Vào & Nhóm Tham Gia)</h2>
                  <div className="grid grid-cols-1 md:grid-cols-5 gap-3 mb-3">
                    <input type="text" placeholder="Họ tên / Biệt danh" value={newMember.name} onChange={e => setNewMember({...newMember, name: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm" />
                    <input type="date" value={newMember.joinDate} onChange={e => setNewMember({...newMember, joinDate: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm" />
                    <input type="text" placeholder="Ngân hàng (VD: VCB, VIB, MB)" value={newMember.bankId} onChange={e => setNewMember({...newMember, bankId: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm" />
                    <input type="text" placeholder="Số tài khoản" value={newMember.accountNo} onChange={e => setNewMember({...newMember, accountNo: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm" />
                    <button
                      onClick={() => {
                        if (!newMember.name) return alert('Nhập tên thành viên!');
                        setMembers([...members, { ...newMember, id: 'm_' + Date.now(), active: true, accountName: newMember.name.toUpperCase() }]);
                        setNewMember({ ...newMember, name: '', accountNo: '' });
                      }}
                      className="bg-lime-400 text-slate-950 font-bold rounded-lg px-4 py-1.5 text-sm"
                    >
                      Thêm Thành Viên
                    </button>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 overflow-x-auto">
                  <div className="flex flex-wrap gap-4 mb-4">
                    <div>
                      <label className="text-xs text-slate-400 block">Chỉ định Chủ tịch Quỹ Sân:</label>
                      <select value={tennisPresidentId} onChange={e => setTennisPresidentId(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-bold text-lime-400">
                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block">Chỉ định Chủ tịch Quỹ Độ:</label>
                      <select value={betPresidentId} onChange={e => setBetPresidentId(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-bold text-amber-400">
                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <table className="w-full text-left text-sm">
                    <thead className="text-xs text-slate-400 border-b border-slate-800">
                      <tr>
                        <th className="py-2">Tên thành viên</th>
                        <th className="py-2">Ngày vào</th>
                        <th className="py-2">Đánh Tennis</th>
                        <th className="py-2">Đi Nhậu</th>
                        <th className="py-2">Tham gia Độ</th>
                        <th className="py-2">Ngân hàng & STK</th>
                        <th className="py-2">Xóa</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {members.map(m => (
                        <tr key={m.id}>
                          <td className="py-2.5 font-bold">{m.name}</td>
                          <td className="py-2.5">
                            <input type="date" value={m.joinDate} onChange={e => setMembers(members.map(x => x.id === m.id ? {...x, joinDate: e.target.value} : x))} className="bg-slate-950 border border-slate-700 rounded px-2 py-0.5 text-xs" />
                          </td>
                          <td className="py-2.5">
                            <input type="checkbox" checked={m.inTennis} onChange={e => setMembers(members.map(x => x.id === m.id ? {...x, inTennis: e.target.checked} : x))} />
                          </td>
                          <td className="py-2.5">
                            <input type="checkbox" checked={m.inNhau} onChange={e => setMembers(members.map(x => x.id === m.id ? {...x, inNhau: e.target.checked} : x))} />
                          </td>
                          <td className="py-2.5">
                            <input type="checkbox" checked={m.inDo} onChange={e => setMembers(members.map(x => x.id === m.id ? {...x, inDo: e.target.checked} : x))} />
                          </td>
                          <td className="py-2.5 text-xs text-slate-300">{m.bankId} - {m.accountNo}</td>
                          <td className="py-2.5">
                            <button onClick={() => setMembers(members.filter(x => x.id !== m.id))} className="text-rose-400 text-xs">Xóa</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
