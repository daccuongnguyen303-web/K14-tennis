<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quỹ Tổ Tennis K14</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const THREAT_MESSAGES = [
      "⚠️ Cảnh báo: Tiền quỹ không phải lá mít! Đóng chậm lần sau ra sân đứng ngoài nhặt bóng bằng miệng, miễn đánh!",
      "🔥 Nhắn gửi các đồng chí nợ phí: Sân bãi thì vẫn mướt, bia thì vẫn tu ừng ừng mà tiền thì lẩn đi đâu? Chuyển khoản ngay kẻo Chủ tịch gạch tên khỏi danh sách vàng!",
      "🚨 Khất nợ là hành vi thiếu văn hóa tennis! Ai chậm đóng quỹ chuẩn bị tinh thần mang vợt đi thế chấp quán nước ven đường.",
      "⚡ Thông báo nghiêm túc: Trốn nợ quỹ K14, ra sân gặp quả smash thẳng mặt không cần báo trước. Sống chậm lại, chuyển khoản nhanh lên các bố!",
      "🎯 Tiền sân, tiền nhậu, tiền độ đã điểm danh đủ. Các con giợn còn nợ quỹ mau chóng nộp phạt, đừng để anh em phải dùng đến biện pháp nghiệp vụ hình sự!",
      "💀 Đời ngắn ngủi, đừng để tên mình bêu rếu trên bảng nợ xấu K14. Sống là phải uy tín, ck ngay và luôn cho Chủ tịch!"
    ];

    const formatVND = (num) => Math.round(num || 0).toLocaleString('vi-VN') + 'đ';
    const isEndOfQuarterMonth = (dateStr) => dateStr ? [3, 6, 9, 12].includes(new Date(dateStr).getMonth() + 1) : false;

    function App() {
      const [activeTab, setActiveTab] = useState('thongbao');
      const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('k14_members')) || []);
      const [tennisPresidentId, setTennisPresidentId] = useState(() => localStorage.getItem('k14_tennis_pres') || '');
      const [betPresidentId, setBetPresidentId] = useState(() => localStorage.getItem('k14_bet_pres') || '');
      const [quarterConfig, setQuarterConfig] = useState(() => JSON.parse(localStorage.getItem('k14_quarter_cfg')) || { name: 'Quý 4/2026', startDate: '2026-10-01', endDate: '2026-12-31', baseCourtBookingFee: 0, baseBallsFee: 0 });
      const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem('k14_sessions')) || []);
      const [nhauList, setNhauList] = useState(() => JSON.parse(localStorage.getItem('k14_nhau')) || []);
      const [bets, setBets] = useState(() => JSON.parse(localStorage.getItem('k14_bets')) || []);

      const [randomThreat, setRandomThreat] = useState('');
      const [activeQR, setActiveQR] = useState(null);

      useEffect(() => {
        const chosen = THREAT_MESSAGES[Math.floor(Math.random() * THREAT_MESSAGES.length)];
        setRandomThreat(chosen);
      }, []);

      const [newSession, setNewSession] = useState({ date: new Date().toISOString().split('T')[0], ballBoyAndWater: 0, overtime: 0, note: '' });

      const [newNhau, setNewNhau] = useState({
        date: new Date().toISOString().split('T')[0],
        title: '',
        payerId: members[0]?.id || '',
        totalBill: 0,
        participants: []
      });

      const [editingBetId, setEditingBetId] = useState(null);
      const [newBet, setNewBet] = useState({
        date: new Date().toISOString().split('T')[0],
        matchName: '',
        score: '',
        amountPerLoser: 50000,
        winners: [],
        losers: []
      });

      const [editingMemberId, setEditingMemberId] = useState(null);
      const [memberForm, setMemberForm] = useState({ name: '', joinDate: new Date().toISOString().split('T')[0], bankId: '', accountNo: '' });

      useEffect(() => { localStorage.setItem('k14_members', JSON.stringify(members)); }, [members]);
      useEffect(() => { localStorage.setItem('k14_tennis_pres', tennisPresidentId); }, [tennisPresidentId]);
      useEffect(() => { localStorage.setItem('k14_bet_pres', betPresidentId); }, [betPresidentId]);
      useEffect(() => { localStorage.setItem('k14_quarter_cfg', JSON.stringify(quarterConfig)); }, [quarterConfig]);
      useEffect(() => { localStorage.setItem('k14_sessions', JSON.stringify(sessions)); }, [sessions]);
      useEffect(() => { localStorage.setItem('k14_nhau', JSON.stringify(nhauList)); }, [nhauList]);
      useEffect(() => { localStorage.setItem('k14_bets', JSON.stringify(bets)); }, [bets]);

      const tPresident = members.find(m => m.id === tennisPresidentId) || members[0] || { name: 'Chưa chọn', bankId: '', accountNo: '', accountName: '' };
      const bPresident = members.find(m => m.id === betPresidentId) || members[0] || { name: 'Chưa chọn', bankId: '', accountNo: '', accountName: '' };

      const tennisCalculations = useMemo(() => {
        const qStart = new Date(quarterConfig.startDate);
        const qEnd = new Date(quarterConfig.endDate);
        const tennisMembers = members.filter(m => m.active && m.inTennis);
        const activeDaysMap = {};
        let sumActiveDays = 0;

        tennisMembers.forEach(m => {
          const effectiveStart = new Date(m.joinDate) > qStart ? new Date(m.joinDate) : qStart;
          const days = Math.max(0, Math.round((qEnd - effectiveStart) / (1000 * 60 * 60 * 24)) + 1);
          activeDaysMap[m.id] = days;
          sumActiveDays += days;
        });

        const sessionShares = {};
        tennisMembers.forEach(m => { sessionShares[m.id] = 0; });
        let totalSessionsCost = 0;

        sessions.forEach(s => {
          const sCost = Number(s.ballBoyAndWater || 0) + Number(s.overtime || 0);
          totalSessionsCost += sCost;
          const eligible = tennisMembers.filter(m => new Date(m.joinDate) <= new Date(s.date));
          const count = eligible.length || 1;
          eligible.forEach(m => { sessionShares[m.id] += sCost / count; });
        });

        const totalFixedQuarterFee = Number(quarterConfig.baseCourtBookingFee || 0) + Number(quarterConfig.baseBallsFee || 0);

        const memberBreakdown = tennisMembers.map(m => {
          const ratio = sumActiveDays > 0 ? activeDaysMap[m.id] / sumActiveDays : 0;
          const proratedFixedFee = totalFixedQuarterFee * ratio;
          const totalUsed = proratedFixedFee + (sessionShares[m.id] || 0);
          const balance = Number(m.quarterPaid || 0) - totalUsed;
          return { ...m, totalUsed, balance };
        });

        const totalPaidInitial = tennisMembers.reduce((acc, m) => acc + Number(m.quarterPaid || 0), 0);
        const totalAllCosts = totalFixedQuarterFee + totalSessionsCost;

        return { memberBreakdown, totalPaidInitial, totalSessionsCost, totalAllCosts, netFundBalance: totalPaidInitial - totalAllCosts };
      }, [members, quarterConfig, sessions]);

      const nhauCalculations = useMemo(() => {
        const stats = {};
        members.forEach(m => { stats[m.id] = { paidOut: 0, consumed: 0, net: 0, name: m.name }; });
        nhauList.forEach(item => {
          const bill = Number(item.totalBill || 0);
          if (stats[item.payerId]) stats[item.payerId].paidOut += bill;
          const count = item.participants && item.participants.length > 0 ? item.participants.length : 1;
          const share = bill / count;
          (item.participants || []).forEach(pid => { if (stats[pid]) stats[pid].consumed += share; });
        });
        Object.keys(stats).forEach(id => { stats[id].net = stats[id].paidOut - stats[id].consumed; });
        return { stats };
      }, [members, nhauList]);

      const betCalculations = useMemo(() => {
        const stats = {};
        members.forEach(m => { stats[m.id] = { unpaidAmount: 0, wins: 0, losses: 0 }; });
        bets.forEach(b => {
          const amt = Number(b.amountPerLoser || 0);
          (b.winners || []).forEach(wid => { if (stats[wid]) stats[wid].wins += 1; });
          (b.losers || []).forEach(lid => {
            if (stats[lid]) {
              stats[lid].losses += 1;
              if (!(b.paidByLosers || []).includes(lid)) {
                stats[lid].unpaidAmount += amt;
              }
            }
          });
        });
        return { stats };
      }, [members, bets]);

      const notificationRows = useMemo(() => {
        return members.filter(m => m.active).map(m => {
          const tInfo = tennisCalculations.memberBreakdown.find(x => x.id === m.id);
          const tennisDebt = tInfo && tInfo.balance < 0 ? Math.abs(tInfo.balance) : 0;
          const betDebt = (betCalculations.stats[m.id] || {}).unpaidAmount || 0;
          
          const nInfo = nhauCalculations.stats[m.id] || { net: 0 };
          const nhauDebt = nInfo.net < 0 ? Math.abs(nInfo.net) : 0;

          const latestNhau = nhauList[nhauList.length - 1];
          const nhauPayer = members.find(x => x.id === (latestNhau ? latestNhau.payerId : '')) || tPresident;

          return {
            ...m,
            tennisDebt,
            betDebt,
            nhauDebt,
            toTennisPresident: tennisDebt > 0 ? tennisDebt : 0,
            toBetPresident: betDebt > 0 ? betDebt : 0,
            toNhauPayer: nhauDebt > 0 ? nhauDebt : 0,
            nhauPayerObj: nhauPayer
          };
        });
      }, [members, tennisCalculations, nhauCalculations, betCalculations, nhauList, tPresident]);

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 pb-16">
          <header className="border-b border-emerald-900/20 bg-emerald-950 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-white text-emerald-950 flex items-center justify-center font-black text-xl shadow-lg border-2 border-emerald-800">K14</div>
                <div>
                  <h1 className="text-lg md:text-xl font-black tracking-tight text-white uppercase">Quỹ Tổ Tennis K14</h1>
                  <p className="text-xs text-emerald-300">Chủ tịch Sân: <strong className="text-white">{tPresident?.name}</strong> • Chủ tịch Độ: <strong className="text-white">{bPresident?.name}</strong></p>
                </div>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto gap-1.5 pb-2.5">
              {[
                { id: 'thongbao', label: '📢 1. Thông Báo & Đòi Nợ' },
                { id: 'tennis', label: '🎾 2. Quỹ Sân Tennis' },
                { id: 'nhau', label: '🍻 3. Quỹ Nhậu' },
                { id: 'do', label: '🏆 4. Kết Quả Độ' },
                { id: 'congno', label: '📊 5. Báo Cáo Công Nợ' },
                { id: 'qr', label: '💳 6. VietQR' },
                { id: 'members', label: '👥 Thành Viên (' + members.length + ')' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap transition-all ${activeTab === t.id ? 'bg-white text-emerald-950 shadow-md' : 'bg-emerald-900/60 text-emerald-100 hover:bg-emerald-900'}`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-6 space-y-6">
            {activeTab === 'thongbao' && (
              <div className="space-y-6">
                <div className="bg-rose-50 border-2 border-rose-500 text-rose-900 p-5 rounded-2xl shadow-md flex items-start gap-4">
                  <div className="text-3xl">👺</div>
                  <div>
                    <h3 className="font-black text-base text-rose-700 uppercase tracking-wide mb-1">Góc Nhắc Nợ Nghiêm Khắc Của Tổ K14</h3>
                    <p className="text-sm font-bold leading-relaxed">{randomThreat}</p>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                    <h2 className="text-lg font-black text-emerald-950">Bảng Nhắc Đóng Phí & Công Nợ Chi Tiết (6 Cột)</h2>
                    <span className="text-xs text-slate-500 italic">* Bấm vào số tiền tại các cột phải đóng để hiện mã QR chuyển khoản nhanh.</span>
                  </div>
                  <table className="w-full text-left text-sm whitespace-nowrap">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="py-3 px-3">Thành viên</th>
                        <th className="py-3 px-3">Tiền sân bóng</th>
                        <th className="py-3 px-3">Tiền độ</th>
                        <th className="py-3 px-3">Tiền nhậu</th>
                        <th className="py-3 px-3 bg-emerald-50/60 text-emerald-900">Phải đóng Chủ tịch Sân ({tPresident.name})</th>
                        <th className="py-3 px-3 bg-amber-50/60 text-amber-900">Phải đóng Chủ tịch Độ ({bPresident.name})</th>
                        <th className="py-3 px-3 bg-blue-50/60 text-blue-900">Phải đóng Người trả nhậu</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {notificationRows.length === 0 ? (
                        <tr><td colSpan="7" className="text-center py-6 text-slate-400">Chưa có thành viên nào. Hãy vào Tab "Thành Viên" để thêm mới!</td></tr>
                      ) : notificationRows.map(row => (
                        <tr key={row.id} className="hover:bg-slate-50">
                          <td className="py-3 px-3 font-bold text-slate-900">{row.name}</td>
                          <td className="py-3 px-3 font-medium text-slate-700">{formatVND(row.tennisDebt)}</td>
                          <td className="py-3 px-3 font-medium text-slate-700">{formatVND(row.betDebt)}</td>
                          <td className="py-3 px-3 font-medium text-slate-700">{formatVND(row.nhauDebt)}</td>
                          
                          <td 
                            className="py-3 px-3 font-black text-emerald-700 bg-emerald-50/30 cursor-pointer hover:underline"
                            onClick={() => setActiveQR({ bankId: tPresident.bankId, accountNo: tPresident.accountNo, accountName: tPresident.accountName, amount: row.toTennisPresident, label: `Đóng quỹ sân cho ${tPresident.name} (${row.name})` })}
                          >
                            {formatVND(row.toTennisPresident)}
                          </td>

                          <td 
                            className="py-3 px-3 font-black text-amber-700 bg-amber-50/30 cursor-pointer hover:underline"
                            onClick={() => setActiveQR({ bankId: bPresident.bankId, accountNo: bPresident.accountNo, accountName: bPresident.accountName, amount: row.toBetPresident, label: `Đóng quỹ độ cho ${bPresident.name} (${row.name})` })}
                          >
                            {formatVND(row.toBetPresident)}
                          </td>

                          <td 
                            className="py-3 px-3 font-black text-blue-700 bg-blue-50/30 cursor-pointer hover:underline"
                            onClick={() => setActiveQR({ bankId: row.nhauPayerObj.bankId || 'VCB', accountNo: row.nhauPayerObj.accountNo || '', accountName: row.nhauPayerObj.accountName || '', amount: row.toNhauPayer, label: `Trả tiền nhậu cho ${row.nhauPayerObj.name} (${row.name})` })}
                          >
                            {formatVND(row.toNhauPayer)} <span className="text-xs font-normal text-slate-400">({row.nhauPayerObj.name})</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {activeQR && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 text-center relative">
                      <button onClick={() => setActiveQR(null)} className="absolute top-4 right-4 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-600 hover:bg-slate-200">✕</button>
                      <h4 className="font-black text-base text-emerald-950 mb-1">{activeQR.label}</h4>
                      <p className="text-xs text-slate-500 mb-3">{activeQR.bankId} • <strong className="text-slate-800">{activeQR.accountNo}</strong></p>
                      <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 mb-4 inline-block">
                        <img src={`https://img.vietqr.io/image/${activeQR.bankId}-${activeQR.accountNo}-compact2.png?amount=${activeQR.amount}&addInfo=K14&accountName=${encodeURIComponent(activeQR.accountName)}`} alt="VietQR" className="w-56 h-auto mx-auto rounded-xl"/>
                      </div>
                      <div className="text-lg font-black text-rose-600 mb-4">Cần chuyển: {formatVND(activeQR.amount)}</div>
                      <button onClick={() => { navigator.clipboard.writeText(activeQR.accountNo); alert('Đã copy số tài khoản!'); }} className="w-full py-2.5 rounded-xl bg-emerald-900 hover:bg-emerald-950 text-white font-bold text-sm shadow">Copy Số Tài Khoản</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'tennis' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Tổng Thu Đầu Quý</span>
                    <div className="text-2xl font-black text-emerald-800 mt-1">{formatVND(tennisCalculations.totalPaidInitial)}</div>
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Tiền Đặt Sân Cố Định</span>
                    <input type="number" value={quarterConfig.baseCourtBookingFee} onChange={e => setQuarterConfig({...quarterConfig, baseCourtBookingFee: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-lg font-bold text-slate-800 mt-1" />
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Tiền bóng quý (đã mua trước)</span>
                    <input type="number" value={quarterConfig.baseBallsFee} onChange={e => setQuarterConfig({...quarterConfig, baseBallsFee: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-lg font-bold text-emerald-800 mt-1" />
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-900/10">
                    <span className="text-xs text-slate-500 font-semibold">Số Dư Quỹ Sân</span>
                    <div className={`text-2xl font-black mt-1 ${tennisCalculations.netFundBalance >= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>{formatVND(tennisCalculations.netFundBalance)}</div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-900/10 space-y-4">
                  <h2 className="text-base font-bold text-emerald-900">+ Ghi Nhật Ký Buổi Đánh Tennis Mới</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Ngày đánh</label>
                      <input type="date" value={newSession.date} onChange={e => setNewSession({...newSession, date: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Tiền nhặt bóng + nước</label>
                      <input type="number" placeholder="0" value={newSession.ballBoyAndWater} onChange={e => setNewSession({...newSession, ballBoyAndWater: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm font-semibold" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Tiền đánh thêm giờ</label>
                      <input type="number" placeholder="0" value={newSession.overtime} onChange={e => setNewSession({...newSession, overtime: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm font-semibold" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Tổng số tiền (Tự tính)</label>
                      <div className="w-full bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-1.5 text-sm font-black text-emerald-900 flex items-center">
                        {formatVND(Number(newSession.ballBoyAndWater || 0) + Number(newSession.overtime || 0))}
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-500 block mb-1">Ghi chú buổi đánh</label>
                    <input type="text" placeholder="VD: Buổi đánh chiều thứ 4" value={newSession.note} onChange={e => setNewSession({...newSession, note: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm" />
                  </div>
                  <button onClick={() => {
                    setSessions([{ ...newSession, id: 's_' + Date.now() }, ...sessions]);
                    alert('Đã lưu buổi đánh mới!');
                  }} className="w-full py-2.5 bg-emerald-900 hover:bg-emerald-950 text-white font-bold rounded-xl text-sm shadow">Lưu Buổi Đánh Tennis</button>
                </div>

                <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                  <h3 className="text-base font-bold mb-3 text-emerald-950">Lịch Sử Các Buổi Đánh (Hiển thị 12 dòng gần nhất)</h3>
                  <table className="w-full text-left text-sm whitespace-nowrap">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3">Ngày đánh</th>
                        <th className="py-2.5 px-3">Tiền nhặt bóng + nước</th>
                        <th className="py-2.5 px-3">Tiền đánh thêm giờ</th>
                        <th className="py-2.5 px-3">Tổng số tiền</th>

                <div className="bg-emerald-900/5 border border-emerald-900/20 p-5 rounded-2xl shadow-sm space-y-4">
                  <h3 className="text-base font-bold text-emerald-950">👑 Cấu Hình Ban Chủ Tịch Quỹ K14</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-600 block mb-1">Chủ tịch Quỹ Sân:</label>
                      <select value={tennisPresidentId} onChange={e => setTennisPresidentId(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-emerald-950 shadow-sm">
                        <option value="">-- Chọn Chủ tịch Sân --</option>
                        {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.bankId} - {m.accountNo})</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-600 block mb-1">Chủ tịch Quỹ Độ:</label>
                      <select value={betPresidentId} onChange={e => setBetPresidentId(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-amber-900 shadow-sm">
                        <option value="">-- Chọn Chủ tịch Độ --</option>
                        {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.bankId} - {m.accountNo})</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-900/10 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-base font-bold text-emerald-900">{editingMemberId ? '✏️ Chỉnh Sửa Thông Tin Thành Viên' : '+ Thêm Thành Viên Mới'}</h3>
                    {editingMemberId && <button onClick={() => { setEditingMemberId(null); setMemberForm({ name: '', joinDate: new Date().toISOString().split('T')[0], bankId: '', accountNo: '' }); }} className="text-xs text-rose-600 font-bold underline">Hủy sửa</button>}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Họ tên / Biệt danh</label>
                      <input type="text" placeholder="VD: Cường Federer" value={memberForm.name} onChange={e => setMemberForm({...memberForm, name: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Ngày vào</label>
                      <input type="date" value={memberForm.joinDate} onChange={e => setMemberForm({...memberForm, joinDate: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Ngân hàng (VCB, VIB...)</label>
                      <input type="text" placeholder="VCB" value={memberForm.bankId} onChange={e => setMemberForm({...memberForm, bankId: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm uppercase" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500 block mb-1">Số tài khoản (STK)</label>
                      <input type="text" placeholder="0123456789" value={memberForm.accountNo} onChange={e => setMemberForm({...memberForm, accountNo: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold" />
                    </div>
                  </div>

                  <button onClick={() => {
                    if (!memberForm.name) return alert('Nhập họ tên thành viên!');
                    if (!memberForm.accountNo) return alert('Nhập số tài khoản ngân hàng!');

                    if (editingMemberId) {
                      setMembers(members.map(m => m.id === editingMemberId ? { ...m, name: memberForm.name, joinDate: memberForm.joinDate, bankId: memberForm.bankId.toUpperCase(), accountNo: memberForm.accountNo, accountName: memberForm.name.toUpperCase() } : m));
                      setEditingMemberId(null);
                      alert('Đã cập nhật thông tin thành viên!');
                    } else {
                      const newMem = {
                        id: 'm_' + Date.now(),
                        name: memberForm.name,
                        joinDate: memberForm.joinDate,
                        active: true,
                        inTennis: true,
                        inNhau: true,
                        inDo: true,
                        quarterPaid: 2000000,
                        bankId: memberForm.bankId.toUpperCase() || 'VCB',
                        accountNo: memberForm.accountNo,
                        accountName: memberForm.name.toUpperCase()
                      };
                      setMembers([...members, newMem]);
                      alert('Đã thêm thành viên mới!');
                    }
                    setMemberForm({ name: '', joinDate: new Date().toISOString().split('T')[0], bankId: '', accountNo: '' });
                  }} className="w-full py-2.5 bg-emerald-900 hover:bg-emerald-950 text-white font-bold rounded-xl text-sm shadow">{editingMemberId ? 'Cập Nhật Thông Tin' : 'Thêm Thành Viên Vào Quỹ'}</button>
                </div>

                <div className="bg-white rounded-2xl p-5 shadow-sm border border-emerald-900/10 overflow-x-auto">
                  <h3 className="text-base font-bold mb-3 text-emerald-950">Danh Sách Thành Viên K14 ({members.length})</h3>
                  <table className="w-full text-left text-sm">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3">Họ tên / Biệt danh</th>
                        <th className="py-2.5 px-3">Ngày gia nhập</th>
                        <th className="py-2.5 px-3">Ngân hàng & STK</th>
                        <th className="py-2.5 px-3 text-center">Thao tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {members.length === 0 ? (
                        <tr><td colSpan="4" className="text-center py-6 text-slate-400">Chưa có thành viên nào. Hãy thêm ở khung bên trên!</td></tr>
                      ) : members.map(m => (
                        <tr key={m.id} className="hover:bg-slate-50">
                          <td className="py-3 px-3 font-bold text-slate-900">
                            {m.name} 
                            {m.id === tennisPresidentId && <span className="ml-2 px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] rounded-full font-bold">Chủ tịch Sân</span>}
                            {m.id === betPresidentId && <span className="ml-2 px-2 py-0.5 bg-amber-100 text-amber-800 text-[10px] rounded-full font-bold">Chủ tịch Độ</span>}
                          </td>
                          <td className="py-3 px-3 text-xs text-slate-500">{m.joinDate}</td>
                          <td className="py-3 px-3 text-xs font-semibold text-slate-700">{m.bankId} - {m.accountNo}</td>
                          <td className="py-3 px-3 text-center space-x-1">
                            <button onClick={() => { setEditingMemberId(m.id); setMemberForm({ name: m.name, joinDate: m.joinDate, bankId: m.bankId, accountNo: m.accountNo }); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="px-2.5 py-1 bg-amber-50 text-amber-700 hover:bg-amber-100 rounded text-xs font-bold">Sửa</button>
                            <button onClick={() => { if(confirm(`Xóa thành viên ${m.name}?`)) setMembers(members.filter(item => item.id !== m.id)); }} className="px-2.5 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded text-xs font-bold">Xóa</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
